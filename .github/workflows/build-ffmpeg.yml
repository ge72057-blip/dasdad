name: build-ffmpeg

# 手动触发：GitHub 网页 -> Actions -> build-ffmpeg -> Run workflow
on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg 版本（对应 GitHub 上的 tag：n + 版本号）"
        default: "8.1.3"

env:
  FFMPEG_VERSION: ${{ inputs.ffmpeg_version || '8.1.3' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64, android-x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          local-cache: true

      - name: 安装编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm cmake ninja-build meson autoconf automake libtool \
            pkg-config gettext autopoint texinfo git curl xz-utils make

      - name: 恢复已编好的外部库缓存
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.target }}/prefix
          key: deps-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: deps-${{ matrix.target }}-

      - name: 编译
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/android-build.sh ${{ matrix.target }}

      - name: 上传结果（失败了也上传，里面有日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: out/${{ matrix.target }}
          retention-days: 30

  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSYS2 和依赖库
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils curl
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-x265
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-dav1d
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-libiconv

      - name: 安装可选依赖（包名不存在就跳过，不影响整体）
        run: |
          for p in svt-av1 aom zimg soxr ffnvcodec-headers amf-headers libvpl \
                   libvmaf srt librist libjxl chromaprint whisper.cpp lcms2 libxml2 \
                   openjpeg2 kvazaar openh264 speex gsm; do
            pacman -S --noconfirm --needed "mingw-w64-x86_64-$p" || echo "跳过（没有这个包）：$p"
          done

      - name: 编译
        run: bash scripts/windows-build.sh

      - name: 上传结果（失败了也上传，里面有日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win-x64
          path: out/win-x64
          retention-days: 30

  ios:
    runs-on: macos-14
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [ios-arm64, ios-sim-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译工具
        run: brew install meson ninja cmake pkg-config autoconf automake libtool nasm gettext texinfo

      - name: 恢复已编好的外部库缓存
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.target }}/prefix
          key: deps-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: deps-${{ matrix.target }}-

      - name: 编译
        run: bash scripts/ios-build.sh ${{ matrix.target }}

      - name: 上传结果（失败了也上传，里面有日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: out/${{ matrix.target }}
          retention-days: 30
